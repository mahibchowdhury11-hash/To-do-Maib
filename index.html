<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do Maib</title>
        <link rel="stylesheet" href="style.css"> 
    </head>

    <body>
        <nav class="topbar">
            <h1>To-do Maib</h1>
            <div class="subtitles">
                <p>Your own space for Tasks.</p>
            </div>
        </nav>

        <main class="body1">
            <div class="start">
                <h2>Keep track of Work</h2>
                <p>Don't forget about that thing you're forgetting. With To-Do Maib</p>
            </div>

            <section class="stats">
                <div class="stat-display">
                    <h3 id="finished">0</h3>
                    <h4>Completed.</h4>
                </div>

                <div class="stat-display">
                    <h3 id="unfinished">0</h3>
                    <h4>Incomplete.</h4>
                </div>
            </section>

            <section class="tasks">
                <h2>Add a new Task!</h2>

                <form id="task-form">
                    <input
                        type="text"
                        id="task-input"
                        placeholder="What are you doing today?"
                        required
                        maxlength="100"
                    >

                    <select id="category-input">
                        <option value="School">School</option>
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Coding">Coding</option>
                    </select>

                    <input type="date" id="date-input">

                    <select id="priority-input">
                        <option value="High">High Priority</option>
                        <option value="Medium">Medium Priority</option>
                        <option value="Low">Low Priority</option>
                    </select>

                    <button type="submit">+ Add Task</button>
                </form>
            </section>

            <section class="task-section">
                <h2>Your Tasks</h2>

                <div class="filters">
                    <button class="filter active" data-filter="All">All</button>
                    <button class="filter" data-filter="School">School</button>
                    <button class="filter" data-filter="Personal">Personal</button>
                    <button class="filter" data-filter="Work">Work</button>
                    <button class="filter" data-filter="Coding">Coding</button>
                </div>

                <div class="search-bar">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Which task will you work on?"
                    >
                </div>

                <div id="task-list">
                    <!--The tasks will be here. Okay-->
                </div>

                <p id="empty-message">Add your first task!</p>
            </section>
        </main>

        <footer>
            <p>To-do Maib © | Keep Working!</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
